[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "campaign-api"
version = "0.1.0"
description = "Initial FastAPI control-plane boundary"
requires-python = ">=3.12,<3.13"
dependencies = ["campaign-contracts==0.1.0", "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "boto3>=1.40,<2", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.12", "mypy>=1.17", "moto[dynamodb]>=5.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["campaign_api"]
mypy_path = "src"

[tool.coverage.run]
source = ["campaign_api"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.uv.sources]
campaign-contracts = { path = "../../shared", editable = true }
