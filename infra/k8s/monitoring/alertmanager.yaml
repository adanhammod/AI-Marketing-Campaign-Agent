# Minimal Alertmanager: a single "default" receiver with no external integration (no
# Slack/PagerDuty/email webhook/credentials). Alerts route here and are visible in
# Alertmanager's own UI/API -- wiring a real notification channel is a deliberate,
# separate follow-up once you decide where alerts should actually go.
apiVersion: v1
kind: ConfigMap
metadata: {name: alertmanager-config, namespace: monitoring}
data:
  alertmanager.yml: |
    route:
      receiver: default
    receivers:
      - name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels: {app: alertmanager}
spec:
  replicas: 1
  selector: {matchLabels: {app: alertmanager}}
  template:
    metadata: {labels: {app: alertmanager}}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports: [{containerPort: 9093}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager}
            - {name: data, mountPath: /alertmanager}
          readinessProbe: {httpGet: {path: /-/ready, port: 9093}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9093}, initialDelaySeconds: 5}
      volumes:
        - {name: config, configMap: {name: alertmanager-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager, namespace: monitoring}
spec:
  selector: {app: alertmanager}
  ports: [{port: 9093, targetPort: 9093}]
