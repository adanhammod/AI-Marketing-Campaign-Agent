apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: campaign-ingress-nginx, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/adanhammod/AI-Marketing-Campaign-Agent.git
    targetRevision: main
    path: infra/k8s/ingress-nginx
  destination: {server: https://kubernetes.default.svc, namespace: ingress-nginx}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: campaign-monitoring, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/adanhammod/AI-Marketing-Campaign-Agent.git
    targetRevision: main
    path: infra/k8s/monitoring
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    # False deliberately: infra/k8s/monitoring/namespace.yaml is itself part of what
    # this Application applies, so Argo's own namespace-autocreate flag would be a
    # redundant second mechanism, not a backstop -- the manifest set is self-owning.
    syncOptions: [CreateNamespace=false]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: campaign-agent-dev, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/adanhammod/AI-Marketing-Campaign-Agent.git
    targetRevision: dev
    path: infra/k8s/dev
  destination: {server: https://kubernetes.default.svc, namespace: dev}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=false]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: campaign-agent-prod, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/adanhammod/AI-Marketing-Campaign-Agent.git
    targetRevision: main
    path: infra/k8s/prod
  destination: {server: https://kubernetes.default.svc, namespace: prod}
  syncPolicy:
    syncOptions: [CreateNamespace=false]
