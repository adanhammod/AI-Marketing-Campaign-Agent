apiVersion: v1
kind: ConfigMap
metadata:
  name: campaign-config
  namespace: dev
data:
  ENVIRONMENT: dev
  AWS_REGION: us-east-1
  REPOSITORY_BACKEND: dynamodb
  QUEUE_BACKEND: sqs
  VIDEO_RENDERER: hyperframes
  VIDEO_RENDER_TIMEOUT_SECONDS: "1200"
  NPX_PATH: npx
  CINEMATIC_MUSIC_PATH: /app/assets/music/cinematic.mp3
  SQS_WAIT_TIME_SECONDS: "20"
  SQS_BATCH_SIZE: "1"
  SQS_VISIBILITY_TIMEOUT_SECONDS: "180"
  WORKER_HEARTBEAT_INTERVAL_SECONDS: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-agent-api
  namespace: dev
spec:
  replicas: 1
  # Stateless HTTP service: a real zero-downtime rolling update -- one extra pod comes
  # up and passes readiness before the old one is removed, never fewer than 1 available.
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: campaign-agent-api}}
  template:
    metadata:
      labels: {app: campaign-agent-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: api
          image: adanhammod/campaign-agent-api:e51b61b2872a7bc7335f8fb88e5e13572bab634a
          imagePullPolicy: Always
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: campaign-config}
            - secretRef: {name: campaign-secrets}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe: {httpGet: {path: /health/live, port: 8000}, failureThreshold: 6, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: campaign-agent-api, namespace: dev}
spec:
  selector: {app: campaign-agent-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: campaign-agent-worker, namespace: dev}
spec:
  replicas: 1
  # With replicas=1, a normal RollingUpdate (maxSurge>0) would briefly run two large
  # (1-2 CPU / 2-3Gi) worker pods at once. maxSurge=0/maxUnavailable=1 avoids that by
  # stopping the old pod before starting the new one -- which means the SQS consumer
  # briefly stops polling during every rollout. This is NOT a zero-downtime rollout for
  # the worker. It is acceptable because: (1) SQS durably buffers messages during the
  # gap, (2) the existing graceful-shutdown path (consumer.shutdown() + the
  # terminationGracePeriodSeconds below) drains any in-flight job first, and (3) it
  # never doubles up on the worker's heavy resource footprint.
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app: campaign-agent-worker}}
  template:
    metadata:
      labels: {app: campaign-agent-worker}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: adanhammod/campaign-agent-worker:e51b61b2872a7bc7335f8fb88e5e13572bab634a
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: campaign-config}
            - secretRef: {name: campaign-secrets}
          resources:
            requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 8Gi}
            limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 16Gi}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: render-tmp, mountPath: /app/tmp}
          # Generous budget (150s) for cold-start Chrome/ffmpeg/npx checks before
          # liveness/readiness probing begins -- see build-time self-check in
          # services/worker/Dockerfile.
          startupProbe: {httpGet: {path: /health/live, port: 8080}, failureThreshold: 30, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, initialDelaySeconds: 20}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, initialDelaySeconds: 20}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
        - name: render-tmp
          emptyDir: {sizeLimit: 16Gi}
---
apiVersion: v1
kind: Service
metadata: {name: campaign-agent-worker, namespace: dev}
spec:
  # Not routed by the Ingress (the worker is an SQS consumer, not a web backend) --
  # this Service exists solely so Prometheus can resolve/scrape its /metrics port.
  selector: {app: campaign-agent-worker}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: campaign-agent-frontend, namespace: dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: campaign-agent-frontend}}
  template:
    metadata: {labels: {app: campaign-agent-frontend}}
    spec:
      containers:
        - name: frontend
          image: adanhammod/campaign-agent-frontend:e51b61b2872a7bc7335f8fb88e5e13572bab634a
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          startupProbe: {httpGet: {path: /healthz, port: 8080}, failureThreshold: 6, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: campaign-agent-frontend, namespace: dev}
spec:
  selector: {app: campaign-agent-frontend}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campaign-agent
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: campaign-agent-api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: campaign-agent-frontend, port: {number: 80}}}
