apiVersion: v1
kind: ConfigMap
metadata:
  name: campaign-config
  namespace: dev
data:
  ENVIRONMENT: dev
  AWS_REGION: us-east-1
  REPOSITORY_BACKEND: dynamodb
  QUEUE_BACKEND: sqs
  VIDEO_RENDERER: hyperframes
  VIDEO_RENDER_TIMEOUT_SECONDS: "1200"
  NPX_PATH: npx
  CINEMATIC_MUSIC_PATH: /app/assets/music/cinematic.mp3
  SQS_WAIT_TIME_SECONDS: "20"
  SQS_BATCH_SIZE: "1"
  SQS_VISIBILITY_TIMEOUT_SECONDS: "180"
  WORKER_HEARTBEAT_INTERVAL_SECONDS: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-agent-api
  namespace: dev
spec:
  replicas: 1
  selector: {matchLabels: {app: campaign-agent-api}}
  template:
    metadata: {labels: {app: campaign-agent-api}}
    spec:
      containers:
        - name: api
          image: adanhammod/campaign-agent-api:a3eac036440a96213e02c78040481c01cd02b28f
          imagePullPolicy: Always
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: campaign-config}
            - secretRef: {name: campaign-secrets}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: campaign-agent-api, namespace: dev}
spec:
  selector: {app: campaign-agent-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: campaign-agent-worker, namespace: dev}
spec:
  replicas: 1
  selector: {matchLabels: {app: campaign-agent-worker}}
  template:
    metadata: {labels: {app: campaign-agent-worker}}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: adanhammod/campaign-agent-worker:a3eac036440a96213e02c78040481c01cd02b28f
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: campaign-config}
            - secretRef: {name: campaign-secrets}
          resources:
            requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 8Gi}
            limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 16Gi}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: render-tmp, mountPath: /app/tmp}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, initialDelaySeconds: 20}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, initialDelaySeconds: 20}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
        - name: render-tmp
          emptyDir: {sizeLimit: 16Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: campaign-agent-frontend, namespace: dev}
spec:
  replicas: 1
  selector: {matchLabels: {app: campaign-agent-frontend}}
  template:
    metadata: {labels: {app: campaign-agent-frontend}}
    spec:
      containers:
        - name: frontend
          image: adanhammod/campaign-agent-frontend:a3eac036440a96213e02c78040481c01cd02b28f
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: campaign-agent-frontend, namespace: dev}
spec:
  selector: {app: campaign-agent-frontend}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campaign-agent
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: campaign-agent-api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: campaign-agent-frontend, port: {number: 80}}}
