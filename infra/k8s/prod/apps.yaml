apiVersion: v1
kind: ConfigMap
metadata: {name: campaign-config, namespace: prod}
data:
  ENVIRONMENT: prod
  AWS_REGION: us-east-1
  REPOSITORY_BACKEND: dynamodb
  QUEUE_BACKEND: sqs
  VIDEO_RENDERER: hyperframes
  VIDEO_RENDER_TIMEOUT_SECONDS: "1200"
  NPX_PATH: npx
  CINEMATIC_MUSIC_PATH: /app/assets/music/cinematic.mp3
  SQS_WAIT_TIME_SECONDS: "20"
  SQS_BATCH_SIZE: "1"
  SQS_VISIBILITY_TIMEOUT_SECONDS: "180"
  WORKER_HEARTBEAT_INTERVAL_SECONDS: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: campaign-agent-api, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: campaign-agent-api}}
  template:
    metadata: {labels: {app: campaign-agent-api}}
    spec:
      containers:
        - name: api
          image: adanhammod/campaign-agent-api:50dbda3c33bcdb6f77d88cbeb6404fcfb5e01fe5
          imagePullPolicy: Always
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: campaign-config}}, {secretRef: {name: campaign-secrets}}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
---
apiVersion: v1
kind: Service
metadata: {name: campaign-agent-api, namespace: prod}
spec: {selector: {app: campaign-agent-api}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: campaign-agent-worker, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: campaign-agent-worker}}
  template:
    metadata: {labels: {app: campaign-agent-worker}}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: adanhammod/campaign-agent-worker:50dbda3c33bcdb6f77d88cbeb6404fcfb5e01fe5
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: campaign-config}}, {secretRef: {name: campaign-secrets}}]
          resources:
            requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 8Gi}
            limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 16Gi}
          volumeMounts: [{name: dshm, mountPath: /dev/shm}, {name: render-tmp, mountPath: /app/tmp}]
          livenessProbe: {httpGet: {path: /health/live, port: 8080}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}}
      volumes:
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
        - {name: render-tmp, emptyDir: {sizeLimit: 16Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: campaign-agent-frontend, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: campaign-agent-frontend}}
  template:
    metadata: {labels: {app: campaign-agent-frontend}}
    spec:
      containers:
        - name: frontend
          image: adanhammod/campaign-agent-frontend:50dbda3c33bcdb6f77d88cbeb6404fcfb5e01fe5
          imagePullPolicy: Always
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: campaign-agent-frontend, namespace: prod}
spec: {selector: {app: campaign-agent-frontend}, ports: [{port: 80, targetPort: 8080}]}
