[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "campaign-contracts"
version = "0.1.0"
description = "Shared contracts for the AI Marketing Campaign Agent"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=5"]
dev = ["pytest>=7.4", "pytest-cov>=5"]

[project.scripts]
generate-contract-schemas = "campaign_contracts.schema_generation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["campaign_contracts"]

[tool.coverage.report]
fail_under = 90
show_missing = true
