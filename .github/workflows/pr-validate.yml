name: PR validation
on:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - run: |
          for root in terraform/environments/cluster terraform/environments/prod terraform/environments/terraform-state-bootstrap; do
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f services/frontend/Dockerfile -t campaign-agent-frontend:pr .
      - run: docker build -f services/api/Dockerfile -t campaign-agent-api:pr .
      - name: Worker build requires licensed music
        run: |
          test -s services/worker/assets/music/cinematic.mp3
          docker build -f services/worker/Dockerfile -t campaign-agent-worker:pr .
