name: Cluster Terraform

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply after reviewing the plan
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_dev_alb_allowed_cidr: ${{ vars.DEV_ALB_ALLOWED_CIDR }}
      TF_VAR_music_asset_object_arn: ${{ vars.MUSIC_ASSET_OBJECT_ARN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=terraform/environments/cluster init

      - name: Terraform plan
        run: terraform -chdir=terraform/environments/cluster plan -out=tfplan

      - name: Terraform apply
        if: inputs.apply
        run: terraform -chdir=terraform/environments/cluster apply tfplan
