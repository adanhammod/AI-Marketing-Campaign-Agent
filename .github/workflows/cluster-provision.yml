name: Cluster Terraform

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply after reviewing the plan
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    outputs:
      control_plane_id: ${{ steps.tf-output.outputs.control_plane_id }}

    env:
      TF_VAR_dev_alb_allowed_cidr: ${{ vars.DEV_ALB_ALLOWED_CIDR }}
      TF_VAR_music_asset_object_arn: ${{ vars.MUSIC_ASSET_OBJECT_ARN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=terraform/environments/cluster init

      - name: Terraform plan
        run: terraform -chdir=terraform/environments/cluster plan -out=tfplan

      - name: Terraform apply
        if: inputs.apply
        run: terraform -chdir=terraform/environments/cluster apply tfplan

      - name: Read control-plane instance ID
        id: tf-output
        if: inputs.apply
        run: |
          echo "control_plane_id=$(terraform -chdir=terraform/environments/cluster output -raw control_plane_id)" >> "$GITHUB_OUTPUT"

  bootstrap-argocd:
    name: Bootstrap Argo CD via SSM
    runs-on: ubuntu-latest
    needs: terraform
    if: inputs.apply == true && needs.terraform.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Wait for control plane to be Online in SSM
        run: |
          INSTANCE_ID="${{ needs.terraform.outputs.control_plane_id }}"
          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::control_plane_id output was empty from the terraform job."
            exit 1
          fi

          STATUS=""
          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "")
            if [ "$STATUS" = "Online" ]; then
              echo "Control plane $INSTANCE_ID is Online in SSM."
              break
            fi
            echo "Waiting for SSM registration... attempt $attempt/30 (status: ${STATUS:-none})"
            sleep 10
          done

          if [ "$STATUS" != "Online" ]; then
            echo "::error::Control plane $INSTANCE_ID never became Online in SSM after 5 minutes."
            exit 1
          fi

      - name: Build and send Argo CD bootstrap command via SSM
        id: send-command
        run: |
          INSTANCE_ID="${{ needs.terraform.outputs.control_plane_id }}"

          NS_B64=$(cat infra/k8s/namespaces/dev.yaml; echo ---; cat infra/k8s/namespaces/prod.yaml)
          NS_B64=$(printf '%s' "$NS_B64" | base64 -w0)
          APPS_B64=$(base64 -w0 infra/k8s/argocd/applications.yaml)

          {
            printf 'NS_B64=%q\n' "$NS_B64"
            printf 'APPS_B64=%q\n' "$APPS_B64"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          echo "=== kubectl get nodes (pre-bootstrap) ==="
          kubectl get nodes

          echo "=== ensuring argocd namespace ==="
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

          echo "=== installing Argo CD (stable manifest) ==="
          kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          echo "=== waiting for Argo CD workloads to become available ==="
          kubectl rollout status deployment/argocd-server -n argocd --timeout=5m
          kubectl rollout status deployment/argocd-repo-server -n argocd --timeout=5m
          kubectl rollout status deployment/argocd-dex-server -n argocd --timeout=5m
          kubectl rollout status deployment/argocd-redis -n argocd --timeout=5m
          kubectl rollout status deployment/argocd-applicationset-controller -n argocd --timeout=5m
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=5m

          echo "=== applying dev/prod namespaces ==="
          echo "$NS_B64" | base64 -d | kubectl apply -f -

          echo "=== waiting for Argo CD Application CRD ==="
          CRD_READY=false
          for attempt in $(seq 1 30); do
            if kubectl get crd applications.argoproj.io >/dev/null 2>&1; then
              CRD_READY=true
              break
            fi
            sleep 10
          done
          if [ "$CRD_READY" != "true" ]; then
            echo "Argo CD Application CRD did not become available" >&2
            exit 1
          fi

          echo "=== applying Argo CD Applications ==="
          echo "$APPS_B64" | base64 -d | kubectl apply -f -

          echo "=== verification: nodes ==="
          kubectl get nodes

          echo "=== verification: argocd pods ==="
          kubectl get pods -n argocd

          echo "=== verification: argocd applications ==="
          kubectl get applications -n argocd
          REMOTE_SCRIPT
          } > /tmp/remote-bootstrap.sh

          PARAMS_JSON=$(jq -n --rawfile script /tmp/remote-bootstrap.sh '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Bootstrap Argo CD for campaign-cluster" \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID to $INSTANCE_ID"

      - name: Wait for Argo CD bootstrap command to complete
        run: |
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"
          INSTANCE_ID="${{ needs.terraform.outputs.control_plane_id }}"

          STATUS="Pending"
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $attempt/60: status=$STATUS"
            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
            sleep 15
          done

          echo "=== StandardOutputContent ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Argo CD bootstrap command finished with status: $STATUS"
            echo "=== StandardErrorContent ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

          echo "Argo CD bootstrap completed successfully."
