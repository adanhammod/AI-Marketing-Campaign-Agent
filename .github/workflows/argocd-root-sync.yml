name: Argo CD root Application sync

# The existing cluster predates the App-of-Apps change and already has Argo CD
# installed and running -- it just never received the campaign-apps root
# Application, and there is no other automated path that would ever create it.
# This workflow closes exactly that one gap: apply/update campaign-apps on the
# already-running control plane whenever its definition changes on main. It
# intentionally does nothing else -- it never installs Argo CD, never applies
# namespaces, and never touches any child Application manifest directly. Once
# campaign-apps exists, Argo CD's own reconciliation is the only thing that ever
# creates/updates/removes the children (see infra/k8s/argocd/root-application.yaml).
on:
  push:
    branches: [main]
    paths:
      - infra/k8s/argocd/root-application.yaml
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  sync-root-application:
    name: Apply campaign-apps via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        # Same OIDC role cluster-provision.yml already uses to reach this cluster --
        # no new credentials, no static keys, no public kubectl endpoint.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Read control-plane instance ID from existing state
        id: tf-output
        run: |
          # Read-only: initializes against the real backend to read the
          # control_plane_id output that terraform apply already computed and
          # stored for the existing cluster. No plan, no apply -- this workflow
          # never changes cluster infrastructure.
          terraform -chdir=terraform/environments/cluster init
          echo "control_plane_id=$(terraform -chdir=terraform/environments/cluster output -raw control_plane_id)" >> "$GITHUB_OUTPUT"

      - name: Wait for control plane to be Online in SSM
        run: |
          INSTANCE_ID="${{ steps.tf-output.outputs.control_plane_id }}"
          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::control_plane_id output was empty -- is the cluster stack applied?"
            exit 1
          fi

          STATUS=""
          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "")
            if [ "$STATUS" = "Online" ]; then
              echo "Control plane $INSTANCE_ID is Online in SSM."
              break
            fi
            echo "Waiting for SSM registration... attempt $attempt/30 (status: ${STATUS:-none})"
            sleep 10
          done

          if [ "$STATUS" != "Online" ]; then
            echo "::error::Control plane $INSTANCE_ID never became Online in SSM after 5 minutes."
            exit 1
          fi

      - name: Apply campaign-apps root Application via SSM
        id: send-command
        run: |
          INSTANCE_ID="${{ steps.tf-output.outputs.control_plane_id }}"
          ROOT_APP_B64=$(base64 -w0 infra/k8s/argocd/root-application.yaml)

          {
            # See cluster-provision.yml for why this is wrapped in a quoted bash
            # heredoc: AWS-RunShellScript executes via /bin/sh (no pipefail), and
            # the quoted delimiter guarantees $ROOT_APP_B64 is expanded once, by
            # bash, inside the remote script -- not prematurely by this shell.
            echo "bash <<'ARGOCD_ROOT_SYNC_EOF'"
            printf 'ROOT_APP_B64=%q\n' "$ROOT_APP_B64"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          echo "=== verifying Argo CD is already installed ==="
          if ! kubectl get crd applications.argoproj.io >/dev/null 2>&1; then
            echo "Argo CD Application CRD not found -- this workflow only updates an" >&2
            echo "existing Argo CD install, it does not install Argo CD itself. Run the" >&2
            echo "full cluster-provision.yml bootstrap first." >&2
            exit 1
          fi

          echo "=== applying/updating campaign-apps (idempotent) ==="
          echo "$ROOT_APP_B64" | base64 -d | kubectl apply -f -

          echo "=== verification: campaign-apps ==="
          kubectl get application campaign-apps -n argocd -o wide

          echo "=== verification: all Argo CD applications ==="
          kubectl get applications -n argocd
          REMOTE_SCRIPT
            echo "ARGOCD_ROOT_SYNC_EOF"
          } > /tmp/argocd-root-sync.sh

          PARAMS_JSON=$(jq -n --rawfile script /tmp/argocd-root-sync.sh '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Apply campaign-apps root Application (App-of-Apps)" \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID to $INSTANCE_ID"

      - name: Wait for the command to complete
        run: |
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"
          INSTANCE_ID="${{ steps.tf-output.outputs.control_plane_id }}"

          STATUS="Pending"
          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $attempt/30: status=$STATUS"
            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
            sleep 10
          done

          echo "=== StandardOutputContent ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::campaign-apps sync command finished with status: $STATUS"
            echo "=== StandardErrorContent ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

          echo "campaign-apps applied successfully."
